services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: spc-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    volumes:
      - ./backend:/app
      - backend_data:/app/data

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:

